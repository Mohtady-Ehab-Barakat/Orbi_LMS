[project]
name = "orbitutor"
authors = [
    { name = "OrbitCore Sdn. Bhd.", email = "orbitutor@orbit-core.com" }
]
description = "OrbiTutor: the student app for Frappe Learning, in OrbiTutor's own design"
requires-python = ">=3.14,<3.15"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.format]
indent-style = "tab"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
